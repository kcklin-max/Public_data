name: Daily Data Update

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "dplyr", "readr"))'

      - name: Run Data Updater Script
        run: Rscript update_data.R
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-update daily weather and flu data"
          git push
